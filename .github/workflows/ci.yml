name: CI

# Runs on every push and pull request. The point is that the checks which kept
# this codebase honest (types, lint, tests, the security regression tests) run
# without anyone having to remember to.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests must never reach a real database. These are unreachable on purpose;
      # vite.config.ts sets the same values, this is belt and braces.
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      DIRECT_URL: postgresql://test:test@127.0.0.1:1/test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install (frontend)
        run: npm ci

      - name: Install (server)
        run: npm ci
        working-directory: server

      # The Prisma client is generated, not committed (server/src/generated).
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check frontend
        run: npx tsc -b

      - name: Type-check server
        run: npx tsc --noEmit
        working-directory: server

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx vitest run

      - name: Build frontend
        run: npx vite build

  audit:
    # Separate and non-blocking: a new advisory in a transitive dependency should
    # be loud, not stop an unrelated change from merging. Known, unreachable
    # findings in the Prisma CLI (mysql2, deepmerge-ts) keep this from ever being
    # fully green until Prisma ships a fix.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit (frontend)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit (server)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server

  secrets:
    # Fails the build if a credential-shaped string is committed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
