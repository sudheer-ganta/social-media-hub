  </defs>

  <!-- Outer subtle guide ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#favGlow)" stroke-width="2" stroke-opacity="0.35" fill="none" />

  <!-- FlowPost Swirling Rings Icon (Middle Part Only - No Background Rect) -->
  <circle cx="50" cy="36" r="28" stroke="url(#favIconGrad)" stroke-width="4.5" fill="none" opacity="0.9" />
  <circle cx="62" cy="45" r="28" stroke="url(#favIconGrad)" stroke-width="4.5" fill="none" opacity="0.9" />
  <circle cx="55" cy="60" r="28" stroke="url(#favIconGrad)" stroke-width="4.5" fill="none" opacity="0.9" />
  <circle cx="41" cy="55" r="28" stroke="url(#favIconGrad)" stroke-width="4.5" fill="none" opacity="0.9" />
  <circle cx="36" cy="43" r="28" stroke="url(#favIconGrad)" stroke-width="4.5" fill="none" opacity="0.9" />

  <!-- Inner central circle ring and core -->
  <circle cx="50" cy="50" r="19" stroke="url(#favIconGrad)" stroke-width="4" fill="none" />
  <circle cx="50" cy="50" r="13" fill="url(#favIconGrad)" />
